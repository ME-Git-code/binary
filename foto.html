<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var light = localStorage.getItem("theme_light") === "true";
        document.documentElement.setAttribute(
          "data-theme",
          light ? "light" : "dark",
        );
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🖼 Rasm Shifrlash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <!-- CryptoJS & Firebase SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-links">
        <a href="index.html">🔢 Binary</a>
        <a href="translate.html">🌐 Tarjimon</a>
        <a href="foto.html" class="active">🖼 Rasm Shifrlash</a>
      </div>
      <div class="nav-icons">
        <button class="icon-btn" onclick="showHelp('foto')" aria-label="Yordam">
          ❓
        </button>
        <a href="settings.html" class="icon-btn" aria-label="Sozlamalar">⚙️</a>
      </div>
    </nav>

    <div class="container">
      <h1>🖼 Kalta Kodli Rasm Shifrlash</h1>
      <p class="subtitle">
        Rasm shifrlanadi va bor-yog'i 6 xonali kodga aylanadi
      </p>

      <div class="tabs">
        <button
          class="tab-btn active"
          id="encTab"
          onclick="switchCrypto('encode')"
        >
          Shifrlash (Rasm ➔ Kod)
        </button>
        <button class="tab-btn" id="decTab" onclick="switchCrypto('decode')">
          Tiklash (Kod ➔ Rasm)
        </button>
      </div>

      <!-- SHIFRLASH -->
      <div id="encBox">
        <div class="input-group">
          <label>1. Rasmni tanlang:</label>
          <div class="upload-buttons">
            <button
              type="button"
              class="btn btn-secondary upload-btn"
              onclick="
                triggerHaptic();
                document.getElementById('imgInputGallery').click();
              "
            >
              🖼 Galereyadan
            </button>
            <button
              type="button"
              class="btn btn-secondary upload-btn"
              onclick="
                triggerHaptic();
                document.getElementById('imgInputCamera').click();
              "
            >
              📷 Kameradan
            </button>
          </div>
          <input
            type="file"
            id="imgInputGallery"
            accept="image/*"
            style="display: none"
          />
          <input
            type="file"
            id="imgInputCamera"
            accept="image/*"
            capture="environment"
            style="display: none"
          />
          <div id="imgPreview" class="img-preview"></div>
        </div>
        <div class="input-group">
          <label>2. Maxfiy Parol kiriting:</label>
          <input
            type="password"
            id="encPass"
            placeholder="Parol..."
            class="text-input"
          />
        </div>
        <div class="input-group">
          <label>3. Rasm ko'rish rejimi:</label>
          <select id="deleteMode" class="text-input" style="cursor: pointer">
            <option value="once">
              🔥 1 martalik (Ko'rilgach avtomatik o'chadi)
            </option>
            <option value="keep">
              ♾ Ko'p martalik (Bazada saqlanib qoladi)
            </option>
          </select>
        </div>
        <button
          class="btn btn-primary"
          id="encryptBtn"
          style="width: 100%"
          onclick="encryptAndUpload()"
        >
          🔒 Rasmni Shifrlash
        </button>

        <div class="input-group" style="margin-top: 15px">
          <label>Sizning Kalta Kodingiz:</label>
          <input
            type="text"
            id="shortCodeResult"
            class="text-input"
            readonly
            placeholder="Masalan: K9X2P1"
          />
          <div class="actions">
            <button class="btn btn-secondary" onclick="copyCode()">
              📋 Kodni Nusxalash
            </button>
          </div>
        </div>
      </div>

      <!-- TIKLASH -->
      <div id="decBox" style="display: none">
        <div class="input-group">
          <label>1. 6 xonali Kodni kiriting:</label>
          <input
            type="text"
            id="decCodeInput"
            placeholder="Masalan: K9X2P1"
            class="text-input"
            style="text-transform: uppercase"
          />
        </div>
        <div class="input-group">
          <label>2. Parolni kiriting:</label>
          <input
            type="password"
            id="decPass"
            placeholder="Parol..."
            class="text-input"
          />
        </div>
        <button
          class="btn btn-primary"
          id="decryptBtn"
          style="width: 100%"
          onclick="fetchAndDecrypt()"
        >
          🔓 Rasmni Qayta Tiklash
        </button>

        <div
          id="imgPreviewBox"
          style="margin-top: 15px; text-align: center"
        ></div>
      </div>
    </div>

    <div id="toast" class="status-toast">Nusxalandi!</div>

    <div class="modal-overlay" id="helpModal">
      <div class="modal-box">
        <h3 id="helpModalTitle"></h3>
        <p id="helpModalText"></p>
        <button
          class="btn btn-primary"
          style="width: 100%"
          onclick="closeHelp()"
        >
          Tushunarli
        </button>
      </div>
    </div>

    <script src="common.js"></script>
    <script src="firebase-config.js"></script>
    <script src="foto.js"></script>
  </body>
</html>
