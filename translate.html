<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var light = localStorage.getItem("theme_light") === "true";
        document.documentElement.setAttribute(
          "data-theme",
          light ? "light" : "dark",
        );
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌐 Tarjimon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-links">
        <a href="index.html">🔢 Binary</a>
        <a href="translate.html" class="active">🌐 Tarjimon</a>
        <a href="foto.html">🖼 Rasm Shifrlash</a>
      </div>
      <div class="nav-icons">
        <button
          class="icon-btn"
          onclick="showHelp('translate')"
          aria-label="Yordam"
        >
          ❓
        </button>
        <a href="settings.html" class="icon-btn" aria-label="Sozlamalar">⚙️</a>
      </div>
    </nav>

    <div class="container">
      <h1>🌐 Tezkor Tarjimon</h1>
      <p class="subtitle">Ko'p tilli avtomatsiz tarjima xizmati</p>

      <div class="translator-select">
        <select id="sourceLang">
          <option value="uz">O'zbek tili</option>
          <option value="tr">Turk tili</option>
          <option value="ru">Rus tili</option>
          <option value="en">Ingliz tili</option>
        </select>
        <button class="swap-btn" onclick="swapLanguages()">⇄</button>
        <select id="targetLang">
          <option value="tr">Turk tili</option>
          <option value="uz">O'zbek tili</option>
          <option value="ru">Rus tili</option>
          <option value="en" selected>Ingliz tili</option>
        </select>
      </div>

      <div class="input-group">
        <textarea id="trInput" placeholder="Matnni kiriting..."></textarea>
      </div>
      <button
        class="btn btn-primary u-w-full u-mb-md"
        onclick="translateText()"
      >
        Tarjima qilish
      </button>

      <div class="input-group">
        <textarea
          id="trOutput"
          readonly
          placeholder="Tarjima bu yerda ko'rinadi..."
        ></textarea>
        <div class="actions">
          <button class="btn btn-secondary" onclick="copyTranslate()">
            📋 Nusxalash
          </button>
        </div>
      </div>
    </div>

    <div id="toast" class="status-toast">Nusxalandi!</div>

    <div class="modal-overlay" id="helpModal">
      <div class="modal-box">
        <h3 id="helpModalTitle"></h3>
        <p id="helpModalText"></p>
        <button
          class="btn btn-primary"
          style="width: 100%"
          onclick="closeHelp()"
        >
          Tushunarli
        </button>
      </div>
    </div>

    <script src="common.js"></script>
    <script src="translate.js"></script>
  </body>
</html>
