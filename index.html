<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary Kodlash va Retranslyatsiya</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      html,
      body {
        width: 100%;
        overflow-x: hidden;
      }

      body {
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 15px;
      }

      .container {
        background-color: #1e293b;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 700px;
      }

      h1 {
        text-align: center;
        margin-bottom: 8px;
        color: #38bdf8;
        font-size: 1.6rem;
      }

      p.subtitle {
        text-align: center;
        color: #94a3b8;
        margin-bottom: 20px;
        font-size: 0.9rem;
      }

      .tabs {
        display: flex;
        margin-bottom: 20px;
        background-color: #0f172a;
        border-radius: 8px;
        padding: 4px;
        gap: 4px;
      }

      .tab-btn {
        flex: 1;
        padding: 10px 6px;
        border: none;
        background: none;
        color: #94a3b8;
        font-weight: 600;
        cursor: pointer;
        border-radius: 6px;
        transition: all 0.3s ease;
        font-size: 0.85rem;
      }

      .tab-btn.active {
        background-color: #0284c7;
        color: #ffffff;
      }

      .input-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #cbd5e1;
        font-weight: 500;
        font-size: 0.95rem;
      }

      textarea {
        width: 100%;
        height: 110px;
        background-color: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 12px;
        color: #f8fafc;
        font-size: 0.95rem;
        resize: vertical;
        outline: none;
        transition: border-color 0.3s;
      }

      textarea:focus {
        border-color: #38bdf8;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        justify-content: flex-end;
      }

      .btn {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        transition: background 0.2s ease;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
      }

      .btn-primary {
        background-color: #0284c7;
        color: white;
      }

      .btn-primary:hover {
        background-color: #0369a1;
      }

      .btn-secondary {
        background-color: #334155;
        color: #cbd5e1;
      }

      .btn-secondary:hover {
        background-color: #475569;
      }

      .error-message {
        color: #ef4444;
        font-size: 0.85rem;
        margin-top: 6px;
        display: none;
      }

      .status-toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: #10b981;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 0.9rem;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
        z-index: 10000;
      }

      .status-toast.show {
        opacity: 1;
      }

      /* Translator Floating Button */
      .translate-btn {
        position: fixed;
        top: 15px;
        right: 15px;
        width: 48px;
        height: 48px;
        background: #0284c7;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        transition: 0.3s;
        z-index: 999;
      }

      .translate-btn:hover {
        transform: scale(1.08);
        background: #0ea5e9;
      }

      /* Translator Modal Window */
      .translator-modal {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(6px);
        z-index: 9999;
        padding: 15px;
      }

      .translator-modal.active {
        display: flex;
      }

      .translator-box {
        width: 100%;
        max-width: 500px;
        background: #1e293b;
        padding: 20px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        animation: popup 0.25s ease;
      }

      @keyframes popup {
        from {
          transform: scale(0.9);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .translator-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .translator-header h2 {
        color: #38bdf8;
        font-size: 1.3rem;
      }

      .translator-header button {
        background: none;
        border: none;
        font-size: 24px;
        color: #94a3b8;
        cursor: pointer;
        line-height: 1;
      }

      .translator-select {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        align-items: center;
      }

      .translator-select select {
        flex: 1;
        padding: 8px 10px;
        background: #0f172a;
        color: white;
        border: 1px solid #334155;
        border-radius: 8px;
        outline: none;
        font-size: 0.88rem;
        min-width: 0;
      }

      .swap-btn {
        width: 38px;
        height: 38px;
        background: #0284c7;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        flex-shrink: 0;
      }

      .translate-now {
        width: 100%;
        margin: 12px 0;
        padding: 10px;
        background: #0284c7;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 600;
      }

      .translate-now:hover {
        background-color: #0369a1;
      }

      .translator-actions {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }

      .translator-actions button {
        flex: 1;
        padding: 10px;
        background: #334155;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.88rem;
      }

      .translator-actions button:hover {
        background: #475569;
      }

      /* Mobile Optimizations (Media Queries) */
      @media (max-width: 600px) {
        body {
          padding: 10px;
          padding-top: 65px; /* Top translate icon overlap check */
        }

        .container {
          padding: 16px;
        }

        h1 {
          font-size: 1.4rem;
        }

        .tabs {
          flex-direction: row;
        }

        .tab-btn {
          font-size: 0.8rem;
          padding: 8px 4px;
        }

        .actions {
          justify-content: space-between;
        }

        .btn {
          flex: 1;
          justify-content: center;
        }

        .translator-box {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Tarjimon Tugmasi -->
    <div class="translate-btn" onclick="openTranslator()">🌐</div>

    <!-- Main Container -->
    <div class="container">
      <h1>Binary Konvertor</h1>
      <p class="subtitle">Matnlarni ikkilik kodga va aksincha o'giring</p>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchMode('textToBinary')">
          Matn ➔ Binary
        </button>
        <button class="tab-btn" onclick="switchMode('binaryToText')">
          Binary ➔ Matn
        </button>
      </div>

      <div class="input-group">
        <label id="inputLabel" for="inputText">Matnni kiriting:</label>
        <textarea
          id="inputText"
          placeholder="Bu yerga matn kiriting..."
          oninput="convert()"
        ></textarea>
        <div class="actions">
          <button class="btn btn-secondary" onclick="insertSample()">
            Namuna
          </button>
          <button class="btn btn-secondary" onclick="clearFields()">
            Tozalash
          </button>
        </div>
      </div>

      <div class="input-group">
        <label id="outputLabel" for="outputText">Binary natija:</label>
        <textarea
          id="outputText"
          readonly
          placeholder="Natija bu yerda ko'rinadi..."
        ></textarea>
        <div id="errorMessage" class="error-message">
          Faqat 0, 1 va bo'shliqlardan foydalaning!
        </div>
        <div class="actions">
          <button class="btn btn-primary" onclick="copyOutput()">
            📋 Ko'chirib olish
          </button>
        </div>
      </div>
    </div>

    <!-- Tarjimon Modal (Popup) -->
    <div class="translator-modal" id="translatorModal">
      <div class="translator-box">
        <div class="translator-header">
          <h2>🌐 Tarjimon</h2>
          <button onclick="closeTranslator()">&times;</button>
        </div>

        <div class="translator-select">
          <select id="sourceLang">
            <option value="uz">O'zbek tili</option>
            <option value="tr">Turk tili</option>
            <option value="ru">Rus tili</option>
            <option value="en">Ingliz tili</option>
          </select>
          <button class="swap-btn" onclick="swapLanguages()">⇄</button>
          <select id="targetLang">
            <option value="tr">Turk tili</option>
            <option value="uz">O'zbek tili</option>
            <option value="ru">Rus tili</option>
            <option value="en" selected>Ingliz tili</option>
          </select>
        </div>

        <textarea id="trInput" placeholder="Matnni kiriting..."></textarea>

        <button class="translate-now" onclick="translateText()">
          Tarjima qilish
        </button>

        <textarea
          id="trOutput"
          readonly
          placeholder="Tarjima bu yerda ko'rinadi..."
        ></textarea>

        <div class="translator-actions">
          <button onclick="copyTranslate()">📋 Nusxalash</button>
          <button onclick="closeTranslator()">Yopish</button>
        </div>
      </div>
    </div>

    <div id="toast" class="status-toast">Nusxalandi!</div>

    <script>
      let currentMode = "textToBinary";

      function switchMode(mode) {
        currentMode = mode;
        const tabs = document.querySelectorAll(".tab-btn");
        tabs.forEach((tab) => tab.classList.remove("active"));

        const inputLabel = document.getElementById("inputLabel");
        const outputLabel = document.getElementById("outputLabel");
        const inputText = document.getElementById("inputText");

        if (mode === "textToBinary") {
          tabs[0].classList.add("active");
          inputLabel.innerText = "Matnni kiriting:";
          outputLabel.innerText = "Binary natija:";
          inputText.placeholder = "Bu yerga matn kiriting...";
        } else {
          tabs[1].classList.add("active");
          inputLabel.innerText = "Binary kodni kiriting:";
          outputLabel.innerText = "Matn natijasi:";
          inputText.placeholder =
            "Masalan: 01010011 01000001 01001101 01001111 01001101";
        }
        clearFields();
      }

      function convert() {
        const input = document.getElementById("inputText").value;
        const output = document.getElementById("outputText");
        const errorMsg = document.getElementById("errorMessage");

        errorMsg.style.display = "none";

        if (!input.trim()) {
          output.value = "";
          return;
        }

        if (currentMode === "textToBinary") {
          const binaryResult = Array.from(input)
            .map((char) => char.charCodeAt(0).toString(2).padStart(8, "0"))
            .join(" ");
          output.value = binaryResult;
        } else {
          const cleanedInput = input.trim();
          const binaryArray = cleanedInput.split(/\s+/);
          let textResult = "";
          let isValid = true;

          for (let bin of binaryArray) {
            if (bin === "") continue;
            if (!/^[01]+$/.test(bin)) {
              isValid = false;
              break;
            }
            textResult += String.fromCharCode(parseInt(bin, 2));
          }

          if (isValid) {
            output.value = textResult;
          } else {
            errorMsg.style.display = "block";
            output.value = "";
          }
        }
      }

      function copyOutput() {
        const outputText = document.getElementById("outputText");
        if (!outputText.value) return;

        navigator.clipboard.writeText(outputText.value).then(() => {
          showToast("Nusxalandi!");
        });
      }

      function clearFields() {
        document.getElementById("inputText").value = "";
        document.getElementById("outputText").value = "";
        document.getElementById("errorMessage").style.display = "none";
      }

      function insertSample() {
        const inputText = document.getElementById("inputText");
        if (currentMode === "textToBinary") {
          inputText.value = "Salom, Dunyo!";
        } else {
          inputText.value = "01010011 01000001 01001101 01001111 01001101";
        }
        convert();
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.classList.add("show");
        setTimeout(() => {
          toast.classList.remove("show");
        }, 2000);
      }

      // Tarjimon Modal Mantig'i
      function openTranslator() {
        document.getElementById("translatorModal").classList.add("active");
      }

      function closeTranslator() {
        document.getElementById("translatorModal").classList.remove("active");
      }

      function swapLanguages() {
        const source = document.getElementById("sourceLang");
        const target = document.getElementById("targetLang");
        const temp = source.value;
        source.value = target.value;
        target.value = temp;
      }

      const dictionary = {
        "uz-tr": {
          salom: "Merhaba",
          qalaysiz: "Nasılsınız",
          yaxshiman: "İyiyim",
          rahmat: "Teşekkür ederim",
        },
        "tr-uz": {
          merhaba: "Salom",
          nasılsınız: "Qalaysiz",
          iyiyim: "Yaxshiman",
          "teşekkür ederim": "Rahmat",
        },
        "uz-en": {
          salom: "Hello",
          qalaysiz: "How are you",
          yaxshiman: "I am fine",
          rahmat: "Thank you",
        },
        "en-uz": {
          hello: "Salom",
          "how are you": "Qalaysiz",
          "i am fine": "Yaxshiman",
          "thank you": "Rahmat",
        },
        "uz-ru": {
          salom: "Привет",
          qalaysiz: "Как дела",
          yaxshiman: "Я в порядке",
          rahmat: "Спасибо",
        },
        "ru-uz": {
          привет: "Salom",
          "как дела": "Qalaysiz",
          "я в порядке": "Yaxshiman",
          спасибо: "Rahmat",
        },
      };

      async function translateText() {
        const input = document.getElementById("trInput").value.trim();
        const output = document.getElementById("trOutput");
        const source = document.getElementById("sourceLang").value;
        const target = document.getElementById("targetLang").value;

        if (!input) {
          output.value = "";
          return;
        }

        if (source === target) {
          output.value = input;
          return;
        }

        output.value = "Tarjima qilinmoqda...";

        const dictKey = `${source}-${target}`;
        const lowerInput = input.toLowerCase();

        if (dictionary[dictKey] && dictionary[dictKey][lowerInput]) {
          output.value = dictionary[dictKey][lowerInput];
          return;
        }

        try {
          const res = await fetch(
            `https://api.mymemory.translated.net/get?q=${encodeURIComponent(input)}&langpair=${source}|${target}`,
          );
          const data = await res.json();
          if (data && data.responseData) {
            output.value = data.responseData.translatedText;
          } else {
            output.value = "Tarjima topilmadi.";
          }
        } catch (error) {
          output.value = "Xatolik yuz berdi. Internetni tekshiring.";
        }
      }

      function copyTranslate() {
        const trOutput = document.getElementById("trOutput");
        if (!trOutput.value) return;

        navigator.clipboard.writeText(trOutput.value).then(() => {
          showToast("Tarjima nusxalandi!");
        });
      }
    </script>
  </body>
</html>
