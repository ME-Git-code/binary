<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var light = localStorage.getItem("theme_light") === "true";
        document.documentElement.setAttribute(
          "data-theme",
          light ? "light" : "dark",
        );
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary Konvertor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-links">
        <a href="index.html" class="active">🔢 Binary</a>
        <a href="translate.html">🌐 Tarjimon</a>
        <a href="foto.html">🖼 Rasm Shifrlash</a>
      </div>
      <div class="nav-icons">
        <button
          class="icon-btn"
          onclick="showHelp('index')"
          aria-label="Yordam"
        >
          ❓
        </button>
        <a href="settings.html" class="icon-btn" aria-label="Sozlamalar">⚙️</a>
      </div>
    </nav>

    <div class="container">
      <h1>Binary Konvertor</h1>
      <p class="subtitle">Matnlarni ikkilik kodga va aksincha o'giring</p>

      <div class="tabs">
        <button
          class="tab-btn active"
          id="btnText"
          onclick="switchMode('textToBinary')"
        >
          Matn ➔ Binary
        </button>
        <button
          class="tab-btn"
          id="btnBin"
          onclick="switchMode('binaryToText')"
        >
          Binary ➔ Matn
        </button>
      </div>

      <div class="input-group">
        <label id="inputLabel">Matnni kiriting:</label>
        <textarea
          id="inputText"
          placeholder="Bu yerga matn kiriting..."
          oninput="convert()"
        ></textarea>
        <div class="actions">
          <button class="btn btn-secondary" onclick="insertSample()">
            Namuna
          </button>
          <button class="btn btn-secondary" onclick="autoPaste()">
            Joylash
          </button>
          <button class="btn btn-secondary" onclick="clearFields()">
            Tozalash
          </button>
        </div>
      </div>

      <div class="input-group">
        <label id="outputLabel">Binary natija:</label>
        <textarea
          id="outputText"
          readonly
          placeholder="Natija bu yerda ko'rinadi..."
        ></textarea>
        <div id="errorMessage" class="error-message">
          Faqat 0, 1 va bo'shliqlardan foydalaning!
        </div>
        <div class="actions">
          <button class="btn btn-primary" onclick="copyOutput()">
            📋 Ko'chirib olish
          </button>
        </div>
      </div>
    </div>

    <div id="toast" class="status-toast">Nusxalandi!</div>

    <div class="modal-overlay" id="helpModal">
      <div class="modal-box">
        <h3 id="helpModalTitle"></h3>
        <p id="helpModalText"></p>
        <button
          class="btn btn-primary"
          style="width: 100%"
          onclick="closeHelp()"
        >
          Tushunarli
        </button>
      </div>
    </div>
    <script src="common.js"></script>
    <script src="index.js"></script>
  </body>
</html>
